    kind: intermediate
    lifecycle: active
    path: 08_disturbance_linkage/data/processed/fia_tree_damage_agent_evidence
    format: parquet_dataset
    one_row_is: one FIA tree record and exact damage-agent code
    keys: [PLT_CN, INVYR, CONDID, TREE_CN, DAMAGE_AGENT_CD]
    grain_id: fia_tree_damage_agent
    derived_from: forested_condition_foundation
    producer: 08_disturbance_linkage/scripts/03_prepare_fia_damage_agent_evidence.R
    access_mode: prepared_download
    review_status: constrained
    facets: [state, INVYR, DAMAGE_AGENT_CD, COND_STATUS_CD]
    caveats:
      - Includes all FIA condition classes and both eligible and ineligible tree records.
      - Repeated occurrences of the same agent code on one tree are deduplicated with source slots retained.
      - >-
        MANUAL and explicit definition/region applicability fields distinguish
        current lookup coverage from observation-level historical validation.
      - >-
        Unmatched raw TREE records are retained with null condition fields and
        do not enter condition-level fractions.

  - id: fia_condition_damage_denominators
    title: FIA condition damage denominators
    family: disturbance_linkage
    kind: intermediate
    lifecycle: active
    path: 08_disturbance_linkage/data/processed/fia_condition_damage_denominators
    format: parquet_dataset
    one_row_is: one FIA condition with eligible tree denominator ingredients
    keys: [stable_plot_id, PLT_CN, INVYR, CONDID]
    grain_id: fia_condition_visit_stable
    derived_from: forested_condition_foundation
    producer: 08_disturbance_linkage/scripts/03_prepare_fia_damage_agent_evidence.R
    access_mode: prepared_download
    review_status: constrained
    facets: [state, INVYR, COND_STATUS_CD]
    caveats:
      - Includes all FIA condition classes, including conditions with zero eligible trees.
      - The denominator definition is stored in structured columns.
      - >-
        TPA sums come from raw TREE.TPA_UNADJ. Basal area is calculated as
        0.005454 * TREE.DIA_inches^2 * TREE.TPA_UNADJ and is in square feet per acre.

