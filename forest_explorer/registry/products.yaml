# Master product registry — curated
#
# This file is the authoritative list of what data products exist, what one row
# of each means, and what the Forest Data Explorer is allowed to do with them.
# Humans write this file. Nothing in it is inferred from the files themselves.
#
# The companion generator (forest_explorer/catalog/build_inventory.py) reads
# this registry, looks at the actual data root, and records what is physically
# there: row counts, sizes, column lists, and whether the declared key really is
# unique. Generated facts never overwrite curated meaning, and curated meaning is
# never guessed from a schema.
#
# ---------------------------------------------------------------------------
# Field reference
# ---------------------------------------------------------------------------
# id            Stable identifier. Never reuse or rename silently.
# title         Short human name shown in the interface.
# family        Grouping used for browsing (fia, species_niches, ...).
# kind          raw | intermediate | final | analysis | qa | lookup
# lifecycle     Whether the product is expected to exist at all:
#                 active       — built and maintained
#                 planned      — a producer exists or is intended; no output yet
#                 experimental — built, but not committed to
#                 deprecated   — still built, do not build new work on it
#                 retired      — no longer built; kept for provenance
#               This is not the same as availability, which the generator
#               measures, nor review_status, which is about scientific use.
#               A `planned` product being absent is expected; an `active` one
#               being absent is a problem.
# path          Logical path relative to the data root. POSIX, no drive letters.
# format        parquet_file | parquet_dataset | gpkg_layer | csv | csv_glob
# gpkg_layer    Layer name, for format: gpkg_layer.
# one_row_is    Plain-language statement of the output grain.
# keys          Columns that should uniquely identify a row. The generator
#               checks this; a failed check is a finding, not a crash.
# grain_id      Which grain in the `grains:` block a row sits at. The observation
#               hierarchy lives there, declared once.
# derived_from  id of the product this one was built from. Production lineage,
#               not grain: two products can share a grain without either being
#               built from the other.
# producer      Script that writes it.
# intended_access_mode
#               What this product should offer once review completes. Set it when
#               access_mode has been held back to catalog_only pending review, so
#               the intent is not lost.
# access_mode   What the interface may offer for this product today:
#                 catalog_only     — describe it; no extract can be generated
#                 prepared_download— download or filter a finished output
#                 filtered_extract — pick rows and columns from this one product
#                 guided_combined  — may serve as a base for an approved join
# review_status Whether the meaning has been signed off:
#                 certified            — definition and safe use established
#                 constrained          — usable only with the stated restriction
#                 domain_review_required — meaning or method still unresolved
#                 blocked_by_defect    — known data/pipeline defect
#                 not_reviewed         — not yet evaluated
# facets        Columns the interface may expose as filters.
# caveats       Plain-language limits a researcher must see before using it.
# notes         Anything else a maintainer needs.
# ---------------------------------------------------------------------------

registry_version: "0.1.0"
generated_by_contract: "forest_explorer/catalog/build_inventory.py"

families:
  fia_partitions:
    title: FIA state extracts
    blurb: >-
      State-partitioned processed FIA extracts, one Parquet file per state. Several
      are already aggregated rather than raw copies — the tree extract, for
      instance, is grouped by species, subplot, status, size class, and crown
      position. These are the working intermediates the national summaries are
      built from.
  fia_summaries:
    title: FIA national summaries
    blurb: >-
      National tables assembled from the state extracts. This is where most
      researcher-facing FIA work should start.
  fia_lookups:
    title: FIA reference tables
    blurb: Code-to-label tables published by FIA.
  site_climate:
    title: Site climate
    blurb: >-
      Monthly TerraClimate values pulled at FIA plot locations.
  species_niches:
    title: Species climate niches
    blurb: >-
      For each tree species, the climate found across its mapped range. Used to
      ask whether a forest community is made of warm- or cool-associated species.
  thermophilization:
    title: Forest community change
    blurb: >-
      Finished analysis products measuring whether the climate affinity of a
      plot's community is shifting between surveys.
  ids:
    title: Insect and Disease Survey
    blurb: >-
      Aerial survey polygons mapping insect, disease, and other damage.
  disturbance_linkage:
    title: FIA-to-external disturbance linkage
    blurb: >-
      Planned association between FIA plots and external dated events (MTBS
      fire severity, IDS damage polygons).
  climate_grids:
    title: Gridded climate workflows
    blurb: >-
      TerraClimate, PRISM, and WorldClim extraction pipelines for IDS geometry.

# ---------------------------------------------------------------------------
# Grains — what one row of a product counts.
#
# Declared once here so that products sharing a grain say so, instead of each
# restating it. `parent_grain_id` is the observation hierarchy: a condition sits
# inside a plot visit, so a plot-visit value attached to condition rows repeats
# and must never be summed across them.
#
# This is separate from `derived_from` on a product, which records which product
# was used to build which. Two products can share a grain without either being
# built from the other, and a product can be built from another at the same grain.
# ---------------------------------------------------------------------------

grains:
  fia_plot_visit:
    one_row_is: one FIA plot measurement visit
    keys: [PLT_CN, INVYR]

  fia_condition_visit:
    one_row_is: one mapped condition within one FIA plot visit
    keys: [PLT_CN, INVYR, CONDID]
    parent_grain_id: fia_plot_visit

  fia_condition_subplot_species:
    one_row_is: one species on one subplot within one condition of one plot visit
    keys: [PLT_CN, INVYR, CONDID, SUBP, SPCD]
    parent_grain_id: fia_condition_visit

  fia_tree_stratum:
    one_row_is: one species on one subplot, split by live/dead status, diameter class, and crown position
    keys: [PLT_CN, INVYR, CONDID, SUBP, SPCD, STATUSCD, size_class, canopy_layer]
    parent_grain_id: fia_condition_subplot_species

  fia_plot_visit_species_cause:
    one_row_is: one species and cause code within one plot visit
    keys: [PLT_CN, INVYR, SPCD, AGENTCD, component_type]
    parent_grain_id: fia_plot_visit

  fia_condition_species_damage_agent:
    one_row_is: one species and damage-agent code within one condition of one plot visit
    keys: [PLT_CN, INVYR, CONDID, SPCD, DAMAGE_AGENT_CD]
    parent_grain_id: fia_condition_visit

  fia_condition_disturbance_slot:
    one_row_is: one recorded disturbance slot on one condition in one plot visit
    keys: [PLT_CN, INVYR, CONDID, disturbance_slot]
    parent_grain_id: fia_condition_visit

  fia_condition_treatment_slot:
    one_row_is: one recorded treatment slot on one condition in one plot visit
    keys: [PLT_CN, INVYR, CONDID, treatment_slot]
    parent_grain_id: fia_condition_visit

  fia_condition_subplot_growth_habit:
    one_row_is: one growth habit and canopy layer on one subplot within one condition
    keys: [PLT_CN, INVYR, CONDID, SUBP, GROWTH_HABIT_CD, LAYER]
    parent_grain_id: fia_condition_visit

  fia_condition_subplot_plant:
    one_row_is: one recorded plant species on one subplot within one condition
    keys: [PLT_CN, INVYR, CONDID, SUBP, VEG_FLDSPCD, UNIQUE_SP_NBR, LAYER]
    parent_grain_id: fia_condition_visit

  fia_plot_visit_stable:
    one_row_is: one FIA plot visit, carrying the identifier that follows the plot through time
    keys: [stable_plot_id, PLT_CN, INVYR]
    parent_grain_id: fia_plot_visit

  fia_condition_visit_stable:
    one_row_is: one condition within one plot visit, carrying the identifier that follows the plot through time
    keys: [stable_plot_id, PLT_CN, INVYR, CONDID]
    parent_grain_id: fia_condition_visit

  fia_condition_visit_layer:
    one_row_is: one condition within one plot visit, for one community layer
    keys: [community_layer, stable_plot_id, PLT_CN, INVYR, CONDID]
    parent_grain_id: fia_condition_visit_stable

  fia_plot_visit_layer:
    one_row_is: one plot visit, for one community layer
    keys: [community_layer, stable_plot_id, PLT_CN, INVYR]
    parent_grain_id: fia_plot_visit_stable

  fia_plot_survey_interval_layer:
    one_row_is: one gap between two consecutive surveys of one plot, for one community layer
    keys: [community_layer, stable_plot_id, previous_PLT_CN, current_PLT_CN]
    parent_grain_id: fia_stable_plot

  fia_stable_plot:
    one_row_is: one FIA plot location followed through time
    keys: [stable_plot_id]

  fia_stable_plot_life_stage:
    one_row_is: one stable FIA plot and community life stage
    keys: [stable_plot_id, life_stage]
    parent_grain_id: fia_stable_plot

  fia_visit_interval_layer:
    one_row_is: one consecutive-survey interval on a stable plot, for one community layer
    keys: [community_layer, stable_plot_id, previous_PLT_CN, current_PLT_CN]
    parent_grain_id: fia_stable_plot

  fia_visit_pairing_audit:
    one_row_is: one current FIA plot record with its audited predecessor relationship
    keys: [current_PLT_CN]

  fia_survey_interval:
    one_row_is: one resolved previous/current FIA survey relationship
    keys: [interval_id]
    parent_grain_id: fia_stable_plot

  fia_condition_damage_agent:
    one_row_is: one FIA condition and exact FIA tree damage-agent code
    keys: [stable_plot_id, PLT_CN, INVYR, CONDID, DAMAGE_AGENT_CD]
    parent_grain_id: fia_condition_visit_stable

  fia_tree_damage_agent:
    one_row_is: one FIA tree record and exact damage-agent code
    keys: [PLT_CN, INVYR, CONDID, TREE_CN, DAMAGE_AGENT_CD]
    parent_grain_id: fia_condition_visit

  fia_condition_fire_slot:
    one_row_is: one FIA fire disturbance slot on one forest condition
    keys: [stable_plot_id, PLT_CN, INVYR, CONDID, disturbance_slot]
    parent_grain_id: fia_condition_visit_stable

  fia_damage_agent_code:
    one_row_is: one official FIA damage-agent code
    keys: [DAMAGE_AGENT_CD]

  fia_stable_plot_year_severity:
    one_row_is: one plot, year, and burn-severity class
    keys: [stable_plot_id, year, severity_class]
    parent_grain_id: fia_stable_plot

  fia_stable_plot_year_agent:
    one_row_is: one plot, year, and damage-causal agent
    keys: [stable_plot_id, year, DCA_CODE]
    parent_grain_id: fia_stable_plot

  fia_stable_plot_external_event:
    one_row_is: one plot, external source, year, and that source's event code
    keys: [stable_plot_id, source, year, source_event_code]
    parent_grain_id: fia_stable_plot

  fia_stable_plot_mtbs_event:
    one_row_is: one stable plot and MTBS fire event
    keys: [stable_plot_id, mtbs_event_id]
    parent_grain_id: fia_stable_plot

  fia_stable_plot_year_exact_agent:
    one_row_is: one stable plot, IDS survey year, and exact DCA code or nondetection state
    keys: [stable_plot_id, survey_year, dca_code]
    parent_grain_id: fia_stable_plot

  species:
    one_row_is: one source species code
    keys: [species_key]

  species_month_variable_metric:
    one_row_is: one species, month, climate variable, and summary statistic
    keys: [species_key, month, variable, metric]
    parent_grain_id: species

  fia_species_code:
    one_row_is: one FIA species code
    keys: [SPCD]

  fia_forest_type_code:
    one_row_is: one FIA forest type code
    keys: [VALUE]

  climate_site:
    one_row_is: one point location used for climate extraction
    keys: [site_id]

  climate_site_month_variable:
    one_row_is: one site, year, month, and climate variable
    keys: [site_id, year, month, variable]
    parent_grain_id: climate_site

  ids_damage_area:
    one_row_is: one mapped damage polygon in one survey year
    keys: [OBSERVATION_ID, DAMAGE_AREA_ID]

  ids_observation:
    one_row_is: one aerial survey observation in one survey year
    keys: [OBSERVATION_ID]

  ids_surveyed_area:
    one_row_is: one area flown in one survey year
    keys: [SURVEY_FEATURE_ID]

  ids_damage_area_variable_month:
    one_row_is: one damage polygon, climate variable, and calendar month
    keys: [DAMAGE_AREA_ID, variable, calendar_year, calendar_month]
    parent_grain_id: ids_damage_area

  climate_pixel:
    one_row_is: one climate grid cell
    keys: [pixel_id]
products:

  # =========================================================================
  # FIA — state extracts
  # =========================================================================
  - id: fia_cond_partitions
    title: FIA conditions (state extracts)
    family: fia_partitions
    kind: intermediate
    lifecycle: active
    path: 05_fia/data/processed/cond
    format: parquet_dataset
    one_row_is: one mapped condition within one plot visit
    keys: [PLT_CN, INVYR, CONDID]
    grain_id: fia_condition_visit
    producer: 05_fia/scripts/03_extract_trees.R
    access_mode: catalog_only
    review_status: constrained
    facets: [state, INVYR, COND_STATUS_CD, FORTYPCD]
    caveats:
      - Raw FIA codes only; no labels and no derived flags.
      - Use plot_condition_metadata for researcher-facing work.
    notes: Source for plot_condition_metadata and the disturbance classification.

  - id: fia_tree_partitions
    title: FIA tree records (state extracts)
    family: fia_partitions
    kind: intermediate
    lifecycle: active
    path: 05_fia/data/processed/trees
    format: parquet_dataset
    one_row_is: >-
      one species on one subplot in one condition of one plot visit, split by
      live/dead status, diameter class, and crown position
    keys: [PLT_CN, INVYR, CONDID, SUBP, SPCD, STATUSCD, size_class, canopy_layer]
    grain_id: fia_tree_stratum
    derived_from: fia_cond_partitions
    producer: 05_fia/scripts/03_extract_trees.R
    access_mode: catalog_only
    review_status: domain_review_required
    facets: [state, INVYR, SPCD, STATUSCD, size_class, canopy_layer]
    caveats:
      - >-
        ba_per_acre and n_trees_tpa are unadjusted sample-design expansions.
        They are not population estimates.
      - Subplot aggregation rules are not settled; see the tree-grain question.

  - id: fia_seedling_partitions
    title: FIA seedling records (state extracts)
    family: fia_partitions
    kind: intermediate
    lifecycle: active
    path: 05_fia/data/processed/seedlings
    format: parquet_dataset
    one_row_is: >-
      one species counted on one subplot microplot in one condition of one plot
      visit
    keys: [PLT_CN, INVYR, CONDID, SUBP, SPCD]
    grain_id: fia_condition_subplot_species
    derived_from: fia_cond_partitions
    producer: 05_fia/scripts/04_extract_seedlings_mortality.R
    access_mode: catalog_only
    review_status: domain_review_required
    facets: [state, INVYR, SPCD]
    caveats:
      - >-
        Older field manuals recorded or calculated "six or more seedlings"
        differently. Counts are not automatically comparable across decades.

  - id: fia_mortality_partitions
    title: FIA mortality and removals (state extracts)
    family: fia_partitions
    kind: intermediate
    lifecycle: active
    path: 05_fia/data/processed/mortality
    format: parquet_dataset
    one_row_is: >-
      one species and cause-of-death code within one plot visit, separated into
      natural mortality and harvest removal
    keys: [PLT_CN, INVYR, SPCD, AGENTCD, component_type]
    grain_id: fia_plot_visit_species_cause
    producer: 05_fia/scripts/04_extract_seedlings_mortality.R
    access_mode: catalog_only
    review_status: domain_review_required
    facets: [state, INVYR, SPCD, AGENTCD, component_type]
    caveats:
      - >-
        Built from FIA's growth/removal/mortality tables, which carry their own
        time-period meaning. Do not read these as simple per-visit counts.
      - AGENTCD is a cause-of-death code and differs before the national protocol.

  - id: fia_damage_agent_partitions
    title: FIA live-tree damage agents (state extracts)
    family: fia_partitions
    kind: intermediate
    lifecycle: active
    path: 05_fia/data/processed/damage_agents
    format: parquet_dataset
    one_row_is: >-
      one species and damage-agent code within one condition of one plot visit
    keys: [PLT_CN, INVYR, CONDID, SPCD, DAMAGE_AGENT_CD]
    grain_id: fia_condition_species_damage_agent
    derived_from: fia_cond_partitions
    producer: 05_fia/scripts/03_extract_trees.R
    access_mode: catalog_only
    review_status: constrained
    facets: [state, INVYR, SPCD, DAMAGE_AGENT_CD]
    caveats:
      - >-
        Damage on a living tree. This is a different observation from condition
        disturbance and from cause of death; do not merge the three.

  - id: fia_harvest_flag_partitions
    title: FIA incidental harvest flags (state extracts)
    family: fia_partitions
    kind: intermediate
    lifecycle: active
    path: 05_fia/data/processed/harvest_flags
    format: parquet_dataset
    one_row_is: one plot visit where at least one tree carried a harvest/removal code
    keys: [PLT_CN, INVYR]
    grain_id: fia_plot_visit
    producer: 05_fia/scripts/03_extract_trees.R
    access_mode: catalog_only
    review_status: certified
    facets: [state, INVYR]
    caveats:
      - >-
        Only positive flags are stored. A plot visit missing from this table had
        no such code in the processed tree records.

  - id: fia_understory_structure_partitions
    title: FIA understory structure (state extracts)
    family: fia_partitions
    kind: intermediate
    lifecycle: active
    path: 05_fia/data/processed/understory_structure
    format: parquet_dataset
    one_row_is: >-
      one growth habit and canopy layer on one subplot in one condition of one
      plot visit
    keys: [PLT_CN, INVYR, CONDID, SUBP, GROWTH_HABIT_CD, LAYER]
    grain_id: fia_condition_subplot_growth_habit
    derived_from: fia_cond_partitions
    producer: 05_fia/scripts/06_extract_understory.R
    access_mode: catalog_only
    review_status: not_reviewed
    facets: [state, INVYR, growth_habit, layer_label]
    caveats:
      - >-
        From FIA's Phase 2 vegetation protocol, which is collected on a subset of
        plots. Coverage is much sparser than the tree data, and a missing row does
        not mean the plant was absent.
      - >-
        cover_pct_subpcond is cover scaled by the share of the subplot the
        condition occupies. cover_pct is not.
      - >-
        A row means a growth habit was present (cover > 0). The raw table is
        zero-padded; those zero rows are dropped.
    notes: >-
      Producer recovered 2026-07-23: 05_fia/scripts/06_extract_understory.R
      rebuilds this from the raw P2VEG_SUBP_STRUCTURE + SUBP_COND tables (added to
      config.yaml tables_required). Verified byte-identical to the previously
      orphaned product on CA/CO/MT. The script downloads its own inputs, so the
      product is now reproducible from a clean checkout.

  - id: fia_understory_veg_partitions
    title: FIA understory species cover (state extracts)
    family: fia_partitions
    kind: intermediate
    lifecycle: active
    path: 05_fia/data/processed/understory_veg
    format: parquet_dataset
    one_row_is: >-
      one recorded plant species on one subplot in one condition of one plot visit
    keys: [PLT_CN, INVYR, CONDID, SUBP, VEG_FLDSPCD, UNIQUE_SP_NBR, LAYER]
    grain_id: fia_condition_subplot_plant
    derived_from: fia_cond_partitions
    producer: 05_fia/scripts/06_extract_understory.R
    access_mode: catalog_only
    review_status: not_reviewed
    facets: [state, INVYR, growth_habit, plant_family, plant_us_nativity]
    caveats:
      - Phase 2 vegetation protocol; collected on a subset of plots only.
      - >-
        Species codes here are PLANTS symbols, not FIA SPCD. They do not join to
        ref_species or to the species niche tables without a crosswalk.
      - >-
        scientific_name and accepted_symbol resolve superseded PLANTS codes to
        their current name via the dictionary's NEW_SYMBOL/NEW_SCIENTIFIC_NAME;
        other trait fields stay with the recorded symbol.
    notes: >-
      Producer recovered 2026-07-23: 05_fia/scripts/06_extract_understory.R
      rebuilds this from raw P2VEG_SUBPLOT_SPP + SUBP_COND, with plant attributes
      from REF_PLANT_DICTIONARY. Verified byte-identical to the previously
      orphaned product on CA/CO/MT, except 13 rows of one symbol (SPLU5) where the
      current PLANTS dictionary added a trailing space — expected input drift, not
      a build error. This is the only product carrying non-tree plants, and
      06_species_niches/scripts/01_build_species_universe.R depends on it, so the
      species-niche workflow is now reproducible from a clean checkout.

  # =========================================================================
  # FIA — national summaries
  # =========================================================================
  - id: plot_condition_metadata
    title: FIA condition metadata
    family: fia_summaries
    kind: final
    lifecycle: active
    path: 05_fia/data/processed/summaries/plot_condition_metadata.parquet
    format: parquet_file
    one_row_is: one mapped condition within one plot visit
    keys: [PLT_CN, INVYR, CONDID]
    grain_id: fia_condition_visit
    producer: 05_fia/scripts/05_build_fia_summaries.R
    access_mode: guided_combined
    review_status: constrained
    facets: [state, STATECD, INVYR, COND_STATUS_CD, FORTYPCD, forest_type_group]
    caveats:
      - >-
        CONDID identifies a condition inside one visit only. It is not stable
        across visits, so conditions cannot be matched over time by CONDID.
      - >-
        CONDPROP_UNADJ is the share of the plot in this condition. It is not an
        area expansion factor and must not be used as one.
      - Coordinates are the public fuzzed FIA coordinates, not true locations.
      - >-
        Does not yet carry the FIA protocol fields (MANUAL, MEASYEAR, DESIGNCD,
        REMPER) needed to explain protocol-dependent definitions.
    notes: >-
      Base product for the first guided workflow and the primary join table for
      the species-composition products.

  - id: plot_cond_fortypcd
    title: FIA condition forest type (compact)
    family: fia_summaries
    kind: final
    lifecycle: active
    path: 05_fia/data/processed/summaries/plot_cond_fortypcd.parquet
    format: parquet_file
    one_row_is: one mapped condition within one plot visit
    keys: [PLT_CN, INVYR, CONDID]
    grain_id: fia_condition_visit
    producer: 05_fia/scripts/05_build_fia_summaries.R
    access_mode: filtered_extract
    review_status: constrained
    facets: [state, STATECD, INVYR, COND_STATUS_CD, FORTYPCD]
    caveats:
      - Raw codes without labels. For joins use plot_condition_metadata instead.

  - id: fia_condition_disturbance_flags
    title: FIA condition disturbance and treatment flags
    family: fia_summaries
    kind: final
    lifecycle: active
    path: 05_fia/data/processed/summaries/fia_condition_disturbance_flags.parquet
    format: parquet_file
    one_row_is: one mapped condition within one plot visit
    keys: [PLT_CN, INVYR, CONDID]
    grain_id: fia_condition_visit
    derived_from: plot_condition_metadata
    producer: 05_fia/scripts/05_build_fia_summaries.R
    access_mode: guided_combined
    review_status: constrained
    facets: [state, STATECD, INVYR, disturbance_class, region_east_west]
    caveats:
      - >-
        Neutral per-condition flags, not an analysis population. "Control" vs
        "disturbed" is deliberately NOT decided here; build it downstream from
        the flags. Control = is_forested_analysis_condition &
        !has_any_recorded_disturbance & !has_any_treatment; disturbed =
        is_forested_analysis_condition & is_natural_disturbance &
        !is_human_or_harvest & !has_any_treatment.
      - >-
        A "no recorded disturbance" flag means FIA recorded no disturbance code.
        That is an absence of record, not proof of no event.
      - >-
        is_high_severity_proxy uses crown fire (DSTRBCD 32) as a stand-in for
        high-severity fire. That choice has not been signed off scientifically.
    notes: >-
      Reusable condition-level disturbance/treatment flags plus raw FIA codes.
      Filter to whatever population an analysis needs; the repo does not choose
      control vs disturbed.

  - id: plot_disturbance_history
    title: FIA condition disturbance events (long form)
    family: fia_summaries
    kind: final
    lifecycle: active
    path: 05_fia/data/processed/summaries/plot_disturbance_history.parquet
    format: parquet_file
    one_row_is: one recorded disturbance slot on one condition in one plot visit
    keys: [PLT_CN, INVYR, CONDID, disturbance_slot]
    grain_id: fia_condition_disturbance_slot
    derived_from: plot_condition_metadata
    producer: 05_fia/scripts/05_build_fia_summaries.R
    access_mode: filtered_extract
    review_status: constrained
    facets: [STATECD, INVYR, DSTRBCD, disturbance_category, DSTRBYR]
    caveats:
      - >-
        Keeps every recorded event rather than picking one. A condition with
        three disturbances appears three times; do not count rows as conditions.
      - >-
        FIA records a disturbance only above a minimum area and damage threshold,
        looking back a limited number of years. Absence is not proof of absence.

  - id: plot_treatment_history
