    access_mode: prepared_download
    review_status: constrained
    facets: [STATECD, INVYR]
    caveats:
      - >-
        Only forested conditions (COND_STATUS_CD == 1) contribute. A partly
        nonforest plot reports the climate affinity of its forested part.
      - >-
        Conditions are weighted by their share of the visit's forested area, so
        a larger mapped condition counts for more than a smaller one.
      - >-
        forested_plot_proportion says how much of the plot was forest. Values
        well below 1 describe a small patch, not a whole forested plot.
      - Check niche coverage and global-fallback columns before comparing values.

