  - id: ids_damage_areas
    title: IDS damage polygons
    family: ids
    kind: final
    lifecycle: active
    path: 01_ids/data/processed/ids_layers_cleaned.gpkg
    format: gpkg_layer
    gpkg_layer: damage_areas
    one_row_is: one mapped damage polygon in one survey year
    keys: [OBSERVATION_ID, DAMAGE_AREA_ID]
    grain_id: ids_damage_area
    producer: 01_ids/scripts/03_clean_ids.R
    access_mode: catalog_only
    review_status: constrained
    facets: [SURVEY_YEAR, REGION_ID, DCA_CODE, HOST_CODE, DAMAGE_TYPE_CODE]
    caveats:
      - >-
        Damage sketched from an aircraft. Coverage depends on whether an area was
        flown that year, so a blank area can mean "no damage" or "not surveyed".
      - >-
        ACRES is the polygon's own reported acreage, not a measure of overlap
        with anything else.
      - >-
        A handful of rows (6, in 3 identifier groups) share an identifier but
        disagree on some attribute; they are kept and listed in
        01_ids/qa/outputs/damage_areas_identifier_conflicts.csv. They are 0.0001%
        of the layer and do not materially affect any total.
    notes: >-
      Lives in a 5.5 GB GeoPackage. The hosted interface must never scan it;
      requests are handed to a server-side extractor.

      Cross-archive duplication fixed and the layer rebuilt 2026-07-23:
      4,475,827 -> 4,472,333 rows, total ACRES 587,582,463 -> 542,565,563 (the
      earlier build double-counted 7.66% of acreage from observations delivered
      in more than one regional archive). De-duplication lives in
      scripts/utils/ids_dedupe.R (called from 03_clean_ids.R) with tests in
      01_ids/tests/testthat/test_ids_dedupe.R. OBSERVATION_ID + DAMAGE_AREA_ID is
      now unique except for the 3 attribute-conflict groups noted above.

