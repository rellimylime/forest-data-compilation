    access_mode: prepared_download
    review_status: constrained
    facets: [STATECD]
    caveats:
      - >-
        Restricted to visits where seedlings, saplings, and trees all have a
        usable value, so all three stages span the same interval.
      - >-
        One long change per plot. It cannot say when during the interval the
        change happened; use the consecutive-interval product for that.
      - >-
        Endpoints are ordered by recorded measurement date. Plots measured only
        once are absent.
      - >-
        Check survey_pairing_classes_observed. Rows carrying a chronological
        fallback rest on a weaker visit link than a structural match.

