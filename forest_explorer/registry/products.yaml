    keys: [PLT_CN, INVYR, CONDID, treatment_slot]
    grain_id: fia_condition_treatment_slot
    derived_from: plot_condition_metadata
    producer: 05_fia/scripts/05_build_fia_summaries.R
    access_mode: filtered_extract
    review_status: constrained
    facets: [STATECD, INVYR, TRTCD, treatment_category, treatment_year_status]
    caveats:
      - >-
        A treatment is a deliberate management action FIA recorded, normally on
        at least one acre. It is not a measure of how much was cut.
      - >-
        Read treatment_year_status before using any year. It separates real
        calendar years from missing, continuous, and post-inventory values.
    notes: >-
      The TRTYR3 corruption described in the explorer design document is repaired
      in the current build. Checked 2026-07-22: TRTYR3 is int32 in all 50 state
      condition partitions, and holds 5,403 four-digit years spanning 1986-2025
      with no value of 0 or 1 — the same 5,403 records the design document
      reported as coerced to TRUE. The rebuild is recorded in
      scratch_output/fia_fix_temp/rebuild_manifest.json (2026-07-21). Treatment
      timing can be reconsidered for exposure, subject to treatment_year_status.

