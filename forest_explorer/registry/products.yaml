      - >-
        FIA rows carry a PLT_CN. ITRDB rows carry a tree-ring site code such as
        `CANA169`. Neither is this repository's stable_plot_id.
    notes: >-
      This is the file the built climate product actually came from: all 6,956
      site_pixel_map ids match it exactly. Confirmed by the project owner as the
      intended input to the point extraction.

  - id: fia_site_locations
