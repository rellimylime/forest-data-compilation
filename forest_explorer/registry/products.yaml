  - id: forest_first_last_change
    title: Community climate change, first survey to last
    family: thermophilization
    kind: analysis
    lifecycle: active
    path: 07_thermophilization/data/processed/forest_first_last_change.parquet
    format: parquet_file
    one_row_is: one stable plot
