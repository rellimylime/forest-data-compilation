  # =========================================================================
  # Site climate
  # =========================================================================
  - id: site_climate
    title: Monthly climate at survey point locations
    family: site_climate
    kind: final
    lifecycle: active
    path: site_climate/data/recheck/site_climate.parquet
    format: parquet_file
    one_row_is: one site, year, month, and climate variable
    keys: [site_id, year, month, variable]
    grain_id: climate_site_month_variable
    producer: site_climate/scripts/extract_terraclimate_points.R
    access_mode: filtered_extract
    review_status: constrained
    facets: [year, month, variable, water_year]
    caveats:
      - >-
        These are not all FIA plots. Of the 6,956 sites, 4,886 are tree-ring
        (ITRDB) locations worldwide and 2,070 are FIA. Filter on `source` in the
        input location list before treating any subset as an FIA sample.
      - >-
        The FIA sites join on PLT_CN, at the plot-visit level — not
        stable_plot_id, which matches nothing here.
      - >-
        Joining to this repository's FIA products returns only 198 of the 2,070
        FIA sites. The other 1,872 are periodic-inventory visits from 1984-1993,
        and the processed FIA products start at inventory year 2000
        (config.yaml `processed.fia.invyr_min`). This is a coverage mismatch, not
        a broken key.
      - >-
        FIA coverage is five Interior West states only: MT 910, UT 669, ID 224,
        CO 156, WY 111.
      - >-
        Values come from the TerraClimate grid cell containing the point, not
        from the site itself.
      - Scale factors are already applied. Temperatures are degrees C, water is mm.
      - >-
        Some points snap to ocean or masked cells and return nothing; those are
        listed in site_climate/qa/outputs/site_climate_missing_sites.csv.
    notes: >-
      A standalone point extraction, separate from the numbered workflows. It is
      NOT the output of 05_fia/scripts/site_climate/, whose product is not built
      in this data root; docs/DATA_PRODUCTS.md records that wrong path for it.

      Identifier traced 2026-07-22: all 2,070 FIA site ids match a CN in the raw
      FIA PLOT tables exactly, so they are genuine PLT_CN values. The periodic
      inventories they mostly come from are single-year statewide snapshots
      (MT 1989, UT 1993, ID 1991) and predate the annual inventory design, so
      comparing them with modern annual-panel plots needs review before use.

      "recheck" reads as a scratch directory; promote this to a stable release
      path before any handoff.

  - id: site_pixel_map
    title: Survey point to climate grid cell map
