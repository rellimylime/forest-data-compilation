  - id: forest_visit_interval_change_seedlings
    title: Seedling community climate change between consecutive surveys
    family: thermophilization
    kind: analysis
    lifecycle: active
    path: 07_thermophilization/data/processed/forest_visit_interval_change_seedlings.parquet
    format: parquet_file
    one_row_is: one remeasurement interval, for the seedling layer
    keys: [community_layer, stable_plot_id, previous_PLT_CN, current_PLT_CN]
    grain_id: fia_visit_interval_layer
    derived_from: forest_plot_visit_cwm_seedlings
    producer: 07_thermophilization/scripts/04_build_visit_interval_change.R
    access_mode: prepared_download
    review_status: constrained
    facets: [INVYR, dominant_disturbance_class]
    caveats:
      - >-
        A plot measured three times gives two rows. Treating them as independent
        observations understates how correlated repeat visits are.
      - >-
        Every interval uses FIA's own PREV_PLT_CN remeasurement link. Visits that
        are merely chronologically adjacent are excluded, not silently paired.
      - >-
        Disturbance columns describe the later visit of the pair. Use
        fire_within_interval or insect_within_interval to ask whether the dated
        event falls inside the interval.
      - >-
        rate_ columns divide by the INVYR difference. days_between_measurements
        gives measured elapsed time when that distinction matters.

