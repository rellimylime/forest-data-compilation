join_registry_version: "1.0.0"
updated: "2026-09-24"
summary: >-
  Curated one-hop joins for the repository query planner. A join is listed only
  when its keys and row-expansion behavior can be stated explicitly. This file
  does not change or replace the canonical product registry.

relationship_definitions:
  one_to_one: At most one right row is expected for each left row.
  many_to_one: Multiple left rows may share one right row; left row count is preserved.
  one_to_many: A left row may match multiple right rows; the result expands.

status_definitions:
  certified: Join keys and interpretation are reviewed for general use.
  constrained: Join is usable when its warning is followed.
  review_required: Join is reproducible, but the underlying product still needs scientific review.

joins:
  - id: condition_metadata__disturbance_flags
    title: Add condition disturbance and treatment flags
    left_product_id: plot_condition_metadata
    right_product_id: fia_condition_disturbance_flags
    left_on: [PLT_CN, INVYR, CONDID]
    right_on: [PLT_CN, INVYR, CONDID]
    relationship: one_to_one
    result_grain_id: fia_condition_visit
    status: constrained
    warning: Absence of a recorded disturbance is not proof that no event occurred.

  - id: condition_metadata__tree_metrics
    title: Add plot-level tree structure
    left_product_id: plot_condition_metadata
    right_product_id: plot_tree_metrics
    left_on: [PLT_CN, INVYR]
    right_on: [PLT_CN, INVYR]
    relationship: many_to_one
    result_grain_id: fia_condition_visit
    status: constrained
    warning: Plot values repeat across conditions and must never be summed across joined rows.

  - id: condition_metadata__seedling_metrics
    title: Add plot-level seedling totals
    left_product_id: plot_condition_metadata
    right_product_id: plot_seedling_metrics
    left_on: [PLT_CN, INVYR]
    right_on: [PLT_CN, INVYR]
